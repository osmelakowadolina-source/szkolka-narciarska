<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0B1F33">
<title>Szkółka Narciarska — Panel</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Szkółka">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders:wght@600;700;800;900&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============ DESIGN TOKENS ============
   Palette: night piste navy + snow, accented by real piste-difficulty colors,
   which double as the skill-level system (1→5) throughout the app.
   Display face: Big Shoulders (condensed, trail-sign energy).
   Body face: Inter.
============================================ */
:root{
  --navy:#0B1F33;
  --navy-2:#12283F;
  --navy-3:#1B3A57;
  --navy-4:#24466A;
  --snow:#F7F9FC;
  --mist:#C9D6E3;
  --mist-dim:#8FA4B8;
  --ice:#4A90D9;
  --lv1:#2FA84F; /* green - pierwsze kroki */
  --lv2:#2E7FE8; /* blue - podstawy */
  --lv3:#E63946; /* red - pewny siebie */
  --lv4:#9AA5B1; /* black-piste marker, shown lighter for contrast on navy */
  --lv5:#F2A900; /* gold - ekspert/freeride */
  --danger:#E63946;
  --ok:#2FA84F;
  --warn:#F2A900;
  --radius:14px;
  --shadow:0 10px 28px rgba(2,8,16,0.35);
  --shadow-sm:0 4px 14px rgba(2,8,16,0.25);
  --font-display:'Big Shoulders',sans-serif;
  --font-body:'Inter',sans-serif;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:var(--font-body);
  background:var(--navy);
  color:var(--snow);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior:none;
  position:relative;
}
/* subtle topographic contour-line atmosphere behind the whole app */
body::before{
  content:'';
  position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(ellipse 900px 500px at 15% -5%, rgba(74,144,217,0.14), transparent 60%),
    radial-gradient(ellipse 700px 500px at 105% 10%, rgba(242,169,0,0.08), transparent 55%),
    repeating-radial-gradient(circle at 50% 0%, transparent 0, transparent 90px, rgba(255,255,255,0.014) 91px, transparent 92px),
    var(--navy);
}
h1,h2,h3,.display{
  font-family:var(--font-display);
  font-weight:800;
  letter-spacing:0.01em;
  text-transform:uppercase;
  margin:0;
}
button{font-family:inherit;cursor:pointer;}
input,select,textarea{font-family:inherit;}
.hidden{display:none !important;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:var(--navy-3);border-radius:8px;}

/* ============ LOGIN ============ */
#login-screen{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 20% 15%, rgba(74,144,217,0.18), transparent 45%),
    radial-gradient(circle at 85% 80%, rgba(242,169,0,0.10), transparent 40%),
    var(--navy);
}
.login-mountains{
  position:absolute; left:0; right:0; bottom:0; width:100%; height:220px;
  opacity:0.5; pointer-events:none;
}
.login-card{
  width:100%;
  max-width:400px;
  background:var(--navy-2);
  border:1px solid var(--navy-3);
  border-radius:var(--radius);
  padding:32px 28px;
  box-shadow:var(--shadow);
  position:relative;
  z-index:1;
}
.login-mark{
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:0.28em;
  color:var(--mist-dim);
  text-align:center;
  margin-bottom:6px;
}
.login-title{
  font-size:38px;
  text-align:center;
  line-height:0.95;
  margin-bottom:24px;
  background:linear-gradient(90deg,var(--snow),var(--mist));
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
}
.role-toggle{
  display:flex;
  background:var(--navy);
  border:1px solid var(--navy-3);
  border-radius:10px;
  padding:4px;
  margin-bottom:20px;
}
.role-toggle button{
  flex:1;
  padding:10px 8px;
  border:none;
  background:transparent;
  color:var(--mist-dim);
  border-radius:7px;
  font-family:var(--font-display);
  font-size:15px;
  letter-spacing:0.06em;
  text-transform:uppercase;
  font-weight:700;
  transition:all .15s;
}
.role-toggle button.active{
  background:var(--ice);
  color:#fff;
  box-shadow:0 3px 10px rgba(74,144,217,0.45);
}
.field{margin-bottom:14px;}
.field label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--mist-dim);
  margin-bottom:6px;
  font-weight:600;
}
.field input, .field select, .field textarea{
  width:100%;
  padding:12px 14px;
  background:var(--navy);
  border:1px solid var(--navy-3);
  border-radius:9px;
  color:var(--snow);
  font-size:16px;
  outline:none;
  transition:border-color .15s;
}
.field input:focus, .field select:focus, .field textarea:focus{border-color:var(--ice);}
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:8px;
  padding:13px 18px;
  border:none;
  border-radius:10px;
  font-family:var(--font-display);
  font-size:16px;
  letter-spacing:0.04em;
  text-transform:uppercase;
  font-weight:700;
  transition:transform .1s, opacity .15s, filter .15s;
}
.btn:active{transform:scale(0.97);}
.btn:disabled{opacity:0.32;cursor:not-allowed;}
.btn-primary{background:var(--ice);color:#fff;box-shadow:0 6px 16px rgba(74,144,217,0.35);}
.btn-primary:not(:disabled):hover{filter:brightness(1.08);}
.btn-gold{background:var(--lv5);color:#1a1200;box-shadow:0 6px 16px rgba(242,169,0,0.3);}
.btn-gold:not(:disabled):hover{filter:brightness(1.06);}
.btn-outline{background:transparent;color:var(--snow);border:1px solid var(--navy-4);}
.btn-outline:hover{background:var(--navy-3);}
.btn-danger{background:transparent;color:var(--danger);border:1px solid var(--danger);}
.btn-block{width:100%;}
.login-error{color:var(--danger);font-size:13px;margin-top:10px;text-align:center;min-height:16px;}

/* ============ APP SHELL ============ */
#app-shell{display:none;min-height:100vh;}
#app-shell.active{display:flex;}
.sidebar{
  width:220px;
  flex-shrink:0;
  background:var(--navy-2);
  border-right:1px solid var(--navy-3);
  padding:20px 14px;
  display:flex;
  flex-direction:column;
  position:sticky;
  top:0;
  height:100vh;
}
.sidebar .brand{font-size:22px;line-height:0.95;padding:0 6px 18px;display:flex;align-items:center;gap:8px;}
.sidebar .brand span{display:block;font-size:12px;letter-spacing:0.15em;color:var(--mist-dim);text-transform:none;font-family:var(--font-body);font-weight:600;}
.nav-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-radius:9px;
  color:var(--mist);
  font-weight:600;
  font-size:14.5px;
  margin-bottom:2px;
  border:none;
  background:transparent;
  width:100%;
  text-align:left;
  position:relative;
  transition:background .12s;
}
.nav-item.active{background:var(--navy-3);color:#fff;}
.nav-item.active::before{content:'';position:absolute;left:-14px;top:8px;bottom:8px;width:3px;background:var(--lv5);border-radius:0 3px 3px 0;}
.nav-item:hover{background:rgba(255,255,255,0.05);}
.nav-item-logout{color:var(--danger);margin-top:6px;}
.nav-item-logout:hover{background:rgba(230,57,70,0.12);}
@media(max-width:640px){.nav-item-logout{margin-top:0;order:99;}}
.sidebar-footer{margin-top:auto;padding-top:14px;border-top:1px solid var(--navy-3);}
.sidebar-user{font-size:13px;color:var(--mist-dim);padding:0 6px 10px;}
.sidebar-user b{color:var(--snow);display:block;font-size:14px;}

.main{flex:1;min-width:0;padding:28px 32px 60px;max-width:1140px;}
.page-head{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:12px;margin-bottom:22px;}
.page-head h1{font-size:32px;}
.page-sub{color:var(--mist-dim);font-size:13px;text-transform:uppercase;letter-spacing:0.08em;font-weight:600;}

.card{
  background:var(--navy-2);
  border:1px solid var(--navy-3);
  border-radius:var(--radius);
  padding:20px;
  margin-bottom:18px;
  box-shadow:var(--shadow-sm);
}
.card h3{font-size:20px;margin-bottom:14px;}
.grid{display:grid;gap:14px;}
.grid-2{grid-template-columns:1fr 1fr;}
.grid-3{grid-template-columns:repeat(3,1fr);}
.grid-4{grid-template-columns:repeat(4,1fr);}
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;margin-bottom:18px;}
@media(max-width:900px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr 1fr;}}
@media(max-width:640px){.grid-2,.grid-3,.grid-4{grid-template-columns:1fr;} .sidebar{position:fixed;left:0;bottom:0;top:auto;width:100%;height:auto;flex-direction:row;overflow-x:auto;border-right:none;border-top:1px solid var(--navy-3);padding:8px;z-index:40;box-shadow:0 -6px 20px rgba(0,0,0,0.3);} .sidebar .brand,.sidebar-footer,.sidebar-user{display:none;} .nav-item{flex-direction:column;font-size:10px;gap:3px;white-space:nowrap;padding:8px 10px;} .nav-item.active::before{left:50%;top:auto;bottom:0;transform:translateX(-50%);width:22px;height:3px;border-radius:3px 3px 0 0;} .main{padding:18px 16px 110px;}}

.stat{background:var(--navy);border:1px solid var(--navy-3);border-left:3px solid var(--ice);border-radius:11px;padding:16px;position:relative;overflow:hidden;}
.stat .num{font-family:var(--font-display);font-size:32px;font-weight:800;}
.stat .lbl{font-size:11.5px;color:var(--mist-dim);text-transform:uppercase;letter-spacing:0.05em;font-weight:600;margin-top:2px;}
.stat.c-lv1{border-left-color:var(--lv1);}
.stat.c-lv2{border-left-color:var(--lv2);}
.stat.c-lv3{border-left-color:var(--lv3);}
.stat.c-lv5{border-left-color:var(--lv5);}
.stat.c-danger{border-left-color:var(--danger);}

table{width:100%;border-collapse:collapse;font-size:14.5px;}
th{text-align:left;color:var(--mist-dim);font-size:11.5px;text-transform:uppercase;letter-spacing:0.05em;font-weight:700;padding:10px 12px;border-bottom:1px solid var(--navy-3);white-space:nowrap;}
td{padding:12px 12px;border-bottom:1px solid var(--navy-3);vertical-align:middle;}
tr:last-child td{border-bottom:none;}
.table-wrap{overflow-x:auto;margin:0 -4px;}
.table-wrap table{min-width:600px;}
tbody tr{transition:background .1s;}
tbody tr:nth-child(even){background:rgba(255,255,255,0.014);}
tbody tr:hover{background:rgba(255,255,255,0.035);}
.actions-cell{display:flex;gap:8px;flex-wrap:nowrap;white-space:nowrap;}
.truncate{max-width:200px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:inline-block;vertical-align:middle;}
.badge{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:20px;font-size:12.5px;font-weight:700;white-space:nowrap;}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0;}

.avatar{width:32px;height:32px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:800;font-size:13px;color:#fff;flex-shrink:0;}
.name-cell{display:flex;align-items:center;gap:10px;}

.icon-btn{background:transparent;border:1px solid var(--navy-4);color:var(--mist);border-radius:8px;padding:6px 10px;font-size:13px;font-weight:600;transition:background .12s;}
.icon-btn.danger{color:var(--danger);border-color:rgba(230,57,70,0.4);}
.icon-btn:hover{background:var(--navy-3);}
.status-select{background:var(--navy);border:1.5px solid var(--navy-4);color:var(--snow);border-radius:8px;padding:7px 10px;font-size:13.5px;font-weight:600;min-width:130px;}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);
  background:var(--navy-3);border:1px solid var(--ice);color:#fff;
  padding:12px 20px;border-radius:10px;font-size:14px;font-weight:600;
  opacity:0;transition:all .25s;z-index:200;pointer-events:none;box-shadow:0 10px 30px rgba(0,0,0,0.4);
  max-width:90vw;text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* mini calendar (dashboard views) */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.cal-dow{font-size:11px;text-align:center;color:var(--mist-dim);font-weight:700;text-transform:uppercase;}
.cal-cell{
  aspect-ratio:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  border-radius:9px;background:var(--navy);border:1px solid var(--navy-3);font-size:14px;font-weight:600;
  position:relative;color:var(--mist);transition:transform .1s;
}
.cal-cell.today{border-color:var(--ice);}
.cal-cell.has-lessons::after{content:'';position:absolute;bottom:5px;width:5px;height:5px;border-radius:50%;background:var(--lv5);}
.cal-cell.empty{background:transparent;border:none;}
@media(hover:hover){.cal-cell:not(.empty):hover{transform:translateY(-1px);border-color:var(--navy-4);}}

/* ============ WIZARD ============ */
#wizard-overlay{
  display:none;position:fixed;inset:0;background:var(--navy);z-index:100;
  flex-direction:column;
}
#wizard-overlay.active{display:flex;}
.wizard-top{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--navy-3);}
.wizard-close{background:transparent;border:none;color:var(--mist-dim);font-size:26px;line-height:1;}

/* chairlift step tracker — signature element */
.lift-track{position:relative;padding:26px 24px 10px;}
.lift-cable{position:absolute;left:34px;right:34px;top:38px;height:2px;background:var(--navy-3);}
.lift-cable-fill{position:absolute;left:34px;top:38px;height:2px;background:var(--ice);transition:width .3s;}
.lift-stations{display:flex;justify-content:space-between;position:relative;}
.lift-station{display:flex;flex-direction:column;align-items:center;gap:6px;width:14.2%;}
.lift-pole{width:26px;height:26px;border-radius:50%;background:var(--navy-2);border:2px solid var(--navy-3);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--mist-dim);z-index:2;transition:all .25s;}
.lift-station.done .lift-pole{background:var(--ice);border-color:var(--ice);color:#fff;}
.lift-station.current .lift-pole{background:var(--navy);border-color:var(--lv5);color:var(--lv5);transform:scale(1.15);}
.lift-chair{position:absolute;top:26px;font-size:20px;transition:left .35s ease;z-index:3;}
.lift-label{font-size:9.5px;color:var(--mist-dim);text-transform:uppercase;text-align:center;letter-spacing:0.02em;display:none;}
@media(min-width:640px){.lift-label{display:block;}}

.wizard-body{flex:1;overflow-y:auto;display:flex;flex-direction:column;align-items:center;padding:20px 20px 40px;}
.wizard-panel{width:100%;max-width:480px;}
.wizard-panel h2{font-size:30px;text-align:center;margin-bottom:6px;}
.wizard-hint{text-align:center;color:var(--mist-dim);font-size:13.5px;margin-bottom:22px;}

.big-cal{background:var(--navy-2);border:1px solid var(--navy-3);border-radius:16px;padding:16px;box-shadow:var(--shadow-sm);}
.big-cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px;}
.big-cal-head button{background:var(--navy-3);border:none;color:#fff;width:36px;height:36px;border-radius:9px;font-size:18px;}
.big-cal-head .month{font-family:var(--font-display);font-size:20px;text-transform:uppercase;}
.big-cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
.big-cal-cell{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:10px;background:var(--navy);border:1px solid var(--navy-3);font-size:15px;font-weight:600;color:var(--snow);
}
.big-cal-cell.disabled{color:var(--navy-3);pointer-events:none;}
.big-cal-cell.selected{background:var(--ice);border-color:var(--ice);color:#fff;box-shadow:0 4px 14px rgba(74,144,217,0.4);}
.big-cal-cell.today{border-color:var(--lv5);}

.instr-pick{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;margin-bottom:18px;}
.instr-chip{flex-shrink:0;padding:10px 16px;border-radius:11px;background:var(--navy-2);border:1.5px solid var(--navy-3);font-weight:700;font-size:14px;white-space:nowrap;}
.instr-chip.selected{background:var(--ice);border-color:var(--ice);color:#fff;}

.slot-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;}
.slot{padding:14px 6px;text-align:center;border-radius:11px;background:var(--navy-2);border:1.5px solid var(--navy-3);font-family:var(--font-display);font-size:18px;font-weight:700;}
.slot.taken{opacity:0.28;pointer-events:none;text-decoration:line-through;}
.slot.selected{background:var(--ice);border-color:var(--ice);color:#fff;}

.big-input{
  width:100%;padding:18px;font-size:22px;border-radius:13px;background:var(--navy-2);
  border:1.5px solid var(--navy-3);color:var(--snow);outline:none;text-align:center;
  font-family:var(--font-display);letter-spacing:0.02em;
}
.big-input:focus{border-color:var(--ice);}
.phone-row{display:flex;gap:10px;}
.phone-row select{width:118px;padding:0 8px;font-size:16px;border-radius:13px;background:var(--navy-2);border:1.5px solid var(--navy-3);color:var(--snow);}
.phone-row .big-input{text-align:left;letter-spacing:0.06em;}
.field-error{color:var(--danger);font-size:12.5px;margin-top:8px;text-align:center;min-height:16px;}

.level-list{display:flex;flex-direction:column;gap:10px;}
.level-card{
  display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:13px;
  background:var(--navy-2);border:1.5px solid var(--navy-3);text-align:left;transition:border-color .12s;
}
.level-card.selected{border-color:var(--lv-active,var(--ice));background:var(--navy-3);}
.level-badge{
  width:44px;height:44px;border-radius:10px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
  font-family:var(--font-display);font-size:20px;font-weight:800;color:#fff;
}
.level-text b{display:block;font-size:15.5px;}
.level-text span{font-size:12.5px;color:var(--mist-dim);}

.summary-list{display:flex;flex-direction:column;gap:0;}
.summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--navy-3);font-size:15px;gap:12px;}
.summary-row:last-child{border-bottom:none;}
.summary-row .k{color:var(--mist-dim);flex-shrink:0;}
.summary-row .v{font-weight:700;text-align:right;}

/* Dalej / Wstecz sit right under the field, not pinned to the screen bottom */
.wizard-actions{display:flex;gap:12px;margin-top:26px;}
.wizard-actions .btn{flex:1;}

.optional-block{margin-top:22px;padding-top:18px;border-top:1px dashed var(--navy-3);}
.optional-block .opt-label{font-size:11px;text-transform:uppercase;letter-spacing:0.08em;color:var(--mist-dim);font-weight:700;margin-bottom:10px;}
.choice-row{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap;}
.choice-chip{flex:1;min-width:110px;padding:9px 10px;text-align:center;border-radius:9px;background:var(--navy);border:1.5px solid var(--navy-3);font-size:13px;font-weight:700;}
.choice-chip.selected{border-color:var(--ice);background:var(--navy-3);color:#fff;}
.choice-chip.selected.pay-ok{border-color:var(--ok);}
.choice-chip.selected.pay-warn{border-color:var(--warn);}

.empty-state{text-align:center;padding:40px 20px;color:var(--mist-dim);}
.empty-state b{display:block;color:var(--snow);font-size:17px;margin-bottom:6px;font-family:var(--font-display);text-transform:uppercase;}

.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(5,12,20,0.72);z-index:150;align-items:center;justify-content:center;padding:20px;}
.modal-backdrop.active{display:flex;}
.modal{background:var(--navy-2);border:1px solid var(--navy-3);border-radius:var(--radius);padding:24px;width:100%;max-width:420px;max-height:90vh;overflow-y:auto;box-shadow:var(--shadow);}
.modal h3{font-size:22px;margin-bottom:16px;}
.switch-row{display:flex;align-items:center;justify-content:space-between;padding:8px 0;gap:12px;}
.switch{position:relative;width:44px;height:25px;background:var(--navy-3);border-radius:20px;flex-shrink:0;transition:background .2s;}
.switch.on{background:var(--ice);}
.switch .knob{position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:left .2s;}
.switch.on .knob{left:22px;}
</style>
</head>
<body>

<!-- ================= LOGIN ================= -->
<div id="login-screen">
  <svg class="login-mountains" viewBox="0 0 800 220" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg">
    <polygon points="0,220 0,140 120,40 230,140 300,90 420,140 520,60 650,140 720,110 800,140 800,220" fill="#12283F"/>
    <polygon points="0,220 0,170 150,90 260,170 380,110 500,170 630,100 760,170 800,150 800,220" fill="#1B3A57" opacity="0.7"/>
  </svg>
  <div class="login-card">
    <div class="login-mark">GÓRY BYSTRZYCKIE</div>
    <h1 class="login-title">Szkółka<br>Narciarska</h1>
    <div class="role-toggle">
      <button id="role-operator-btn" class="active" onclick="setLoginRole('operator')">Operator</button>
      <button id="role-instructor-btn" onclick="setLoginRole('instructor')">Instruktor</button>
    </div>
    <div class="field">
      <label>E-mail</label>
      <input type="email" id="login-email" autocomplete="username" placeholder="ty@przyklad.pl">
    </div>
    <div class="field">
      <label>Hasło</label>
      <input type="password" id="login-password" autocomplete="current-password" placeholder="••••••••">
    </div>
    <button class="btn btn-primary btn-block" onclick="doLogin()" id="login-btn">Zaloguj się</button>
    <div class="login-error" id="login-error"></div>
    <div class="app-version" style="text-align:center;margin-top:16px;color:var(--mist-dim);font-size:11px;letter-spacing:0.04em;"></div>
  </div>
</div>

<!-- ================= APP SHELL ================= -->
<div id="app-shell">
  <nav class="sidebar">
    <div class="brand">🏔️ Szkółka<span>Panel zarządzania</span></div>
    <div id="nav-items"></div>
    <div class="sidebar-footer">
      <div class="sidebar-user"><b id="sidebar-username">—</b><span id="sidebar-role-label"></span></div>
      <div class="app-version" style="font-size:10.5px;color:var(--mist-dim);text-align:center;margin-top:6px;"></div>
    </div>
  </nav>
  <div class="main" id="main-content"></div>
</div>

<!-- ================= ENROLLMENT WIZARD ================= -->
<div id="wizard-overlay">
  <div class="wizard-top">
    <div class="page-sub">Nowy zapis</div>
    <button class="wizard-close" onclick="closeWizard()">✕</button>
  </div>
  <div class="lift-track">
    <div class="lift-cable"></div>
    <div class="lift-cable-fill" id="lift-fill"></div>
    <div class="lift-chair" id="lift-chair">🚡</div>
    <div class="lift-stations" id="lift-stations"></div>
  </div>
  <div class="wizard-body" id="wizard-body"></div>
</div>

<div class="toast" id="toast"></div>

<!-- ================= MODALS (instructor create/edit) ================= -->
<div class="modal-backdrop" id="instructor-modal-backdrop">
  <div class="modal">
    <h3 id="instructor-modal-title">Nowy instruktor</h3>
    <div class="field"><label>Imię i nazwisko</label><input id="im-name" placeholder="Jan Kowalski"></div>
    <div class="field" id="im-email-field"><label>E-mail (login)</label><input id="im-email" type="email" placeholder="jan@przyklad.pl"></div>
    <div class="field" id="im-pass-field"><label>Hasło tymczasowe</label><input id="im-pass" type="text" placeholder="min. 6 znaków"></div>
    <div class="field"><label>Stawka dla instruktora (zł / zajęcia)</label><input id="im-price" type="number" min="0" step="1" placeholder="60"></div>
    <div class="switch-row">
      <div>
        <b style="font-size:14.5px;">Może zarządzać wszystkimi zajęciami</b><br>
        <span style="font-size:12px;color:var(--mist-dim);">Dodawanie / usuwanie zajęć innych instruktorów</span>
      </div>
      <div class="switch" id="im-canmanage" onclick="this.classList.toggle('on')"><div class="knob"></div></div>
    </div>
    <div style="display:flex;gap:10px;margin-top:18px;">
      <button class="btn btn-outline" style="flex:1" onclick="closeInstructorModal()">Anuluj</button>
      <button class="btn btn-primary" style="flex:1" id="im-save-btn" onclick="saveInstructor()">Zapisz</button>
    </div>
  </div>
</div>

<!-- ================= MODAL (student history + description) ================= -->
<div class="modal-backdrop" id="student-modal-backdrop">
  <div class="modal" style="max-width:640px;" id="student-modal-content"></div>
</div>

<script type="module">
/* =====================================================================
   FIREBASE SETUP — patrz SETUP.md dla pełnej instrukcji.
===================================================================== */
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";
import {
  getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged,
  createUserWithEmailAndPassword
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, addDoc, query, where, onSnapshot, serverTimestamp
} from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyBLd4jinbw7dbxocfoawqNMh1gGQgNEAkU",
  authDomain: "szkolka-7b3d5.firebaseapp.com",
  projectId: "szkolka-7b3d5",
  storageBucket: "szkolka-7b3d5.firebasestorage.app",
  messagingSenderId: "843176275247",
  appId: "1:843176275247:web:5a44f9d096ebaad44205da"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

/* Rejestracja service workera — umożliwia instalację "jak aplikacja" na telefonie */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').catch(()=>{});
  });
}

/* =====================================================================
   WAŻNE — DLACZEGO TA SEKCJA WYGLĄDA TAK, A NIE INACZEJ (uwaga techniczna):
   Ten plik używa <script type="module">. W modułach JS zwykłe `let`/`const`
   oraz zwykłe deklaracje `function` NIE trafiają do obiektu globalnego
   `window`. Atrybuty HTML typu onclick="..."/oninput="..." wykonują się
   jednak w globalnym zasięgu. Dlatego KAŻDA funkcja wywoływana bezpośrednio
   z atrybutu onclick/oninput/onchange musi być jawnie przypisana jako
   `window.nazwaFunkcji = ...` — inaczej przeglądarka zgłasza błąd
   "X is not defined" i nic się nie dzieje po kliknięciu. To był dokładnie
   powód, dla którego przycisk "Dalej" nie reagował po wpisaniu imienia.
===================================================================== */

/* ============ CONSTANTS ============ */
/* =====================================================================
   WERSJA APLIKACJI
   Numer poniżej jest podnoszony przy każdej edycji tego pliku i wyświetlany
   w interfejsie (ekran logowania + dolna część panelu bocznego), żeby dało
   się szybko sprawdzić, czy na urządzeniu wgrała się najnowsza wersja.
   Historia zmian:
   1.0.0 — pierwsza działająca wersja (logowanie, zapisy, statystyki, SMS-y)
   1.1.0 — naprawa błędu "Dalej" w kreatorze zapisu, przyciski bliżej pól,
           przeprojektowanie wizualne, typ zajęć / płatność / status / uwagi,
           przycisk Wyloguj widoczny też na telefonie
   1.2.0 — czytelniejsze tabele, edytowalna cena zajęć (z podpowiedzią
           domyślną), numer wersji w interfejsie
   1.3.0 — zakładka Uczniowie dostępna też dla instruktorów, wyszukiwarka
           uczniów po imieniu/telefonie, pełna historia nauki ucznia
           i trwały opis ucznia edytowalny przez instruktorów
===================================================================== */
const APP_VERSION = '1.3.0';
document.querySelectorAll('.app-version').forEach(el => el.textContent = 'v' + APP_VERSION);

const LEVELS = [
  {n:1, key:'lv1', label:'Pierwsze kroki', desc:'Nigdy nie stał(a) na nartach lub 1–2 razy w życiu'},
  {n:2, key:'lv2', label:'Podstawy',        desc:'Jeździ pługiem, skręca niepewnie'},
  {n:3, key:'lv3', label:'Pewny siebie',    desc:'Skręty równoległe, radzi sobie na czerwonych'},
  {n:4, key:'lv4', label:'Zaawansowany',    desc:'Swobodnie na czarnych trasach'},
  {n:5, key:'lv5', label:'Ekspert / Freeride', desc:'Poza wyznaczonymi trasami, w każdych warunkach'},
];
const COUNTRY_CODES = [
  {code:'+48', label:'🇵🇱 +48', digits:9},
  {code:'+420', label:'🇨🇿 +420', digits:9},
  {code:'+49', label:'🇩🇪 +49', digits:11},
  {code:'+44', label:'🇬🇧 +44', digits:10},
  {code:'+380', label:'🇺🇦 +380', digits:9},
  {code:'+other', label:'🌍 inny', digits:15},
];
const DOW = ['Nd','Pn','Wt','Śr','Cz','Pt','So'];
const MONTHS = ['Styczeń','Luty','Marzec','Kwiecień','Maj','Czerwiec','Lipiec','Sierpień','Wrzesień','Październik','Listopad','Grudzień'];
const STATUS_LABELS = {planned:'Zaplanowane', completed:'Odbyte', noshow:'Nieobecność', cancelled:'Odwołane'};
const AVATAR_PALETTE = ['#2FA84F','#2E7FE8','#E63946','#F2A900','#9B5DE5','#00B4A6'];

/* ============ GLOBAL STATE ============ */
let loginRole = 'operator';
let currentUser = null;   // {uid, name, role, email, pricePerLesson, canManageAll}
let unsubUsers = null, unsubLessons = null, unsubStudents = null;
let instructors = [];     // all instructor profiles
let lessons = [];         // all lessons (live)
let studentNotes = {};    // phone -> {notes, updatedByName, updatedAt}
let studentSearchQuery = '';
let settings = {basePrice:120, instructorRateDefault:60, lessonDuration:60, dayStart:9, dayEnd:16, smsWebhookUrl:''};
let currentPage = 'zapisy';

/* ============ HELPERS ============ */
function pad(n){return String(n).padStart(2,'0');}
function todayISO(){const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove('show'), 2600);
}
function levelMeta(n){return LEVELS.find(l=>l.n===n) || LEVELS[0];}
function fmtMoney(n){return Math.round(n||0).toLocaleString('pl-PL')+' zł';}
function fmtDatePL(iso){
  const [y,m,d] = iso.split('-');
  return `${d}.${m}.${y}`;
}
function cssColor(key){
  return {lv1:'#2FA84F',lv2:'#2E7FE8',lv3:'#E63946',lv4:'#9AA5B1',lv5:'#F2A900'}[key];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('') || '?';
}
function avatarColor(name){
  let h = 0;
  for(const ch of (name||'')) h = (h*31 + ch.charCodeAt(0)) % AVATAR_PALETTE.length;
  return AVATAR_PALETTE[h];
}
function avatarHtml(name){
  return `<span class="avatar" style="background:${avatarColor(name)}">${initials(name)}</span>`;
}
function lessonPrice(l){
  return l.clientPrice||0; // stored as the final total price for the booking
}
function statusBadge(status){
  const map = {
    planned:  {c:'#4A90D9', label:'Zaplanowane'},
    completed:{c:'#2FA84F', label:'Odbyte'},
    noshow:   {c:'#F2A900', label:'Nieobecność'},
    cancelled:{c:'#8FA4B8', label:'Odwołane'},
  };
  const m = map[status] || map.planned;
  return `<span class="badge" style="background:${m.c}22;color:${m.c};"><span class="dot" style="background:${m.c}"></span>${m.label}</span>`;
}
function paymentBadge(status){
  return status==='paid'
    ? `<span class="badge" style="background:#2FA84F22;color:#2FA84F;">Zapłacono</span>`
    : `<span class="badge" style="background:#F2A90022;color:#F2A900;">Do zapłaty</span>`;
}
function typeBadge(l){
  return l.lessonType==='group'
    ? `<span class="badge" style="background:#4A90D922;color:#4A90D9;">Grupa ×${l.groupSize||2}</span>`
    : `<span class="badge" style="background:#8FA4B822;color:#8FA4B8;">Indywidualne</span>`;
}

/* ============ LOGIN ============ */
window.setLoginRole = function(role){
  loginRole = role;
  document.getElementById('role-operator-btn').classList.toggle('active', role==='operator');
  document.getElementById('role-instructor-btn').classList.toggle('active', role==='instructor');
};

window.doLogin = async function(){
  const email = document.getElementById('login-email').value.trim();
  const pass = document.getElementById('login-password').value;
  const errEl = document.getElementById('login-error');
  errEl.textContent = '';
  if(!email || !pass){ errEl.textContent = 'Podaj e-mail i hasło.'; return; }
  const btn = document.getElementById('login-btn');
  btn.disabled = true; btn.textContent = 'Logowanie…';
  try{
    const cred = await signInWithEmailAndPassword(auth, email, pass);
    const snap = await getDoc(doc(db,'users',cred.user.uid));
    if(!snap.exists()){
      errEl.textContent = 'Konto istnieje, ale brak profilu w bazie. Skontaktuj się z operatorem.';
      await signOut(auth);
      return;
    }
    const profile = snap.data();
    if(profile.role !== loginRole){
      errEl.textContent = `To konto jest zarejestrowane jako "${profile.role==='operator'?'Operator':'Instruktor'}". Wybierz właściwą zakładkę logowania.`;
      await signOut(auth);
      return;
    }
    // onAuthStateChanged handles the rest
  }catch(e){
    errEl.textContent = 'Nieprawidłowy e-mail lub hasło.';
  }finally{
    btn.disabled = false; btn.textContent = 'Zaloguj się';
  }
};

window.doLogout = async function(){
  await signOut(auth);
};

onAuthStateChanged(auth, async (user)=>{
  if(!user){
    currentUser = null;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app-shell').classList.remove('active');
    if(unsubUsers) unsubUsers();
    if(unsubLessons) unsubLessons();
    if(unsubStudents) unsubStudents();
    return;
  }
  const snap = await getDoc(doc(db,'users',user.uid));
  if(!snap.exists()) return; // handled in doLogin flow
  const profile = snap.data();
  currentUser = {uid:user.uid, ...profile};
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-shell').classList.add('active');
  document.getElementById('sidebar-username').textContent = currentUser.name || currentUser.email;
  document.getElementById('sidebar-role-label').textContent = currentUser.role==='operator' ? 'Operator' : 'Instruktor';
  await loadSettings();
  subscribeInstructors();
  subscribeLessons();
  subscribeStudents();
  renderNav();
  currentPage = 'zapisy';
  renderPage();
});

/* ============ SETTINGS ============ */
async function loadSettings(){
  const snap = await getDoc(doc(db,'settings','general'));
  if(snap.exists()) settings = {...settings, ...snap.data()};
}
window.saveSettings = async function(){
  const basePrice = Number(document.getElementById('set-baseprice').value)||0;
  const lessonDuration = Number(document.getElementById('set-duration').value)||60;
  const dayStart = Number(document.getElementById('set-daystart').value)||9;
  const dayEnd = Number(document.getElementById('set-dayend').value)||16;
  const smsWebhookUrl = document.getElementById('set-smsurl').value.trim();
  const instructorRateDefault = Number(document.getElementById('set-instr-default').value)||0;
  settings = {...settings, basePrice, lessonDuration, dayStart, dayEnd, smsWebhookUrl, instructorRateDefault};
  await setDoc(doc(db,'settings','general'), settings, {merge:true});
  showToast('Ustawienia zapisane');
  renderPage();
};

/* ============ LIVE DATA ============ */
function subscribeInstructors(){
  if(unsubUsers) unsubUsers();
  unsubUsers = onSnapshot(query(collection(db,'users'), where('role','==','instructor')), (qs)=>{
    instructors = [];
    qs.forEach(d=>instructors.push({uid:d.id, ...d.data()}));
    instructors.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    renderPage();
  });
}
function subscribeLessons(){
  if(unsubLessons) unsubLessons();
  unsubLessons = onSnapshot(collection(db,'lessons'), (qs)=>{
    lessons = [];
    qs.forEach(d=>lessons.push({id:d.id, status:'planned', lessonType:'individual', groupSize:1, paymentStatus:'unpaid', notes:'', ...d.data()}));
    lessons.sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time));
    renderPage();
  });
}
function subscribeStudents(){
  if(unsubStudents) unsubStudents();
  unsubStudents = onSnapshot(collection(db,'students'), (qs)=>{
    studentNotes = {};
    qs.forEach(d=>studentNotes[d.id] = d.data());
    if(currentPage==='uczniowie') renderStudentsList();
  });
}

/* ============ NAV ============ */
function renderNav(){
  const items = currentUser.role==='operator' ? [
    ['zapisy','📅','Zapisy'],
    ['uczniowie','🧑‍🎓','Uczniowie'],
    ['instruktorzy','🧑‍🏫','Instruktorzy'],
    ['statystyki','📊','Statystyki'],
    ['przypomnienia','✉️','Przypomnienia'],
    ['ustawienia','⚙️','Ustawienia'],
  ] : [
    ['zapisy','📅','Kalendarz'],
    ['uczniowie','🧑‍🎓','Uczniowie'],
    ['moje','🎿','Moje godziny'],
  ];
  const nav = document.getElementById('nav-items');
  nav.innerHTML = items.map(([key,icon,label])=>
    `<button class="nav-item ${currentPage===key?'active':''}" onclick="goTo('${key}')">${icon} ${label}</button>`
  ).join('') + `<button class="nav-item nav-item-logout" onclick="doLogout()">🚪 Wyloguj</button>`;
}
window.goTo = function(page){ currentPage = page; renderNav(); renderPage(); };

/* ============ PAGE ROUTER ============ */
function renderPage(){
  if(!currentUser) return;
  renderNav();
  const main = document.getElementById('main-content');
  if(currentPage==='zapisy') return renderCalendarPage(main);
  if(currentPage==='uczniowie') return renderStudentsPage(main);
  if(currentPage==='instruktorzy') return renderInstructorsPage(main);
  if(currentPage==='statystyki') return renderStatsPage(main);
  if(currentPage==='przypomnienia') return renderRemindersPage(main);
  if(currentPage==='ustawienia') return renderSettingsPage(main);
  if(currentPage==='moje') return renderMyStatsPage(main);
}

/* ============ CALENDAR / ZAPISY PAGE ============ */
let calMonth = new Date().getMonth(), calYear = new Date().getFullYear(), calSelectedDate = todayISO();

function renderCalendarPage(main){
  const dayLessons = lessons.filter(l=>l.date===calSelectedDate).sort((a,b)=>a.time.localeCompare(b.time));
  main.innerHTML = `
    <div class="page-head">
      <div><div class="page-sub">${currentUser.role==='operator'?'Wszystkie zajęcia':'Kalendarz wszystkich instruktorów'}</div><h1>Zapisy</h1></div>
      <button class="btn btn-gold" onclick="openWizard()">＋ Nowy zapis</button>
    </div>
    <div class="grid grid-2" style="align-items:start;">
      <div class="card">
        <h3>${MONTHS[calMonth]} ${calYear}</h3>
        <div id="mini-cal"></div>
      </div>
      <div class="card">
        <h3>${fmtDatePL(calSelectedDate)}</h3>
        <div id="day-list">
          ${dayLessons.length===0 ? `<div class="empty-state"><b>Brak zajęć</b>Wybierz inny dzień lub dodaj nowy zapis.</div>` :
          `<div class="table-wrap"><table><thead><tr><th>Godz.</th><th>Uczeń</th><th>Instruktor</th><th>Poz.</th><th>Typ</th><th>Płatność</th><th>Status</th><th></th></tr></thead><tbody>
            ${dayLessons.map(l=>{
              const lv = levelMeta(l.level);
              const canManage = currentUser.role==='operator' || currentUser.canManageAll || l.instructorId===currentUser.uid;
              return `<tr>
                <td><b>${l.time}</b></td>
                <td>${l.studentName}<br><span style="color:var(--mist-dim);font-size:12.5px;">${l.studentPhone}</span></td>
                <td>${l.instructorName}</td>
                <td><span class="badge" style="background:${cssColor(lv.key)}22;color:${cssColor(lv.key)};"><span class="dot" style="background:${cssColor(lv.key)}"></span>${lv.n}</span></td>
                <td>${typeBadge(l)}</td>
                <td>${paymentBadge(l.paymentStatus)}</td>
                <td>${canManage ? `<select class="status-select" onchange="onLessonStatusChange(this,'${l.id}')">
                    ${Object.entries(STATUS_LABELS).map(([k,v])=>`<option value="${k}" ${l.status===k?'selected':''}>${v}</option>`).join('')}
                  </select>` : statusBadge(l.status)}</td>
                <td>${canManage ? `<button class="icon-btn danger" onclick="deleteLesson('${l.id}')">Usuń</button>` : ''}</td>
              </tr>`;
            }).join('')}
          </tbody></table></div>`}
        </div>
      </div>
    </div>
  `;
  renderMiniCal();
}

function renderMiniCal(){
  const el = document.getElementById('mini-cal');
  if(!el) return;
  const first = new Date(calYear, calMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const lessonDates = new Set(lessons.map(l=>l.date));
  let html = `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
    <button class="icon-btn" onclick="calNav(-1)">‹</button>
    <button class="icon-btn" onclick="calNav(1)">›</button>
  </div><div class="cal-grid">`;
  DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html+=`<div class="cal-cell empty"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${calYear}-${pad(calMonth+1)}-${pad(d)}`;
    const isToday = iso===todayISO();
    const has = lessonDates.has(iso);

/* ============ STUDENTS PAGE (operator + instructor) ============ */
function buildStudentsMap(){
  const map = new Map();
  lessons.forEach(l=>{
    const k = l.studentPhone;
    if(!map.has(k)) map.set(k, {name:l.studentName, phone:l.studentPhone, count:0, lastDate:l.date, level:l.level, paymentStatus:l.paymentStatus});
    const s = map.get(k);
    s.count++;
    if(l.date >= s.lastDate){ s.lastDate = l.date; s.level = l.level; s.paymentStatus = l.paymentStatus; }
  });
  return [...map.values()].sort((a,b)=>b.lastDate.localeCompare(a.lastDate));
}

window.saveInstructor = async function(){
  const name = document.getElementById('im-name').value.trim();
  const price = Number(document.getElementById('im-price').value)||0;
  const canManageAll = document.getElementById('im-canmanage').classList.contains('on');
  if(!name){ showToast('Podaj imię i nazwisko'); return; }
  const btn = document.getElementById('im-save-btn'); btn.disabled = true;
  try{
    if(editingInstructorUid){
      await updateDoc(doc(db,'users',editingInstructorUid), {name, pricePerLesson:price, canManageAll});
      showToast('Zapisano zmiany');
    }else{
      const email = document.getElementById('im-email').value.trim();
      const pass = document.getElementById('im-pass').value;
      if(!email || pass.length<6){ showToast('Podaj e-mail i hasło (min. 6 znaków)'); btn.disabled=false; return; }
      // secondary app instance so the operator's own session isn't replaced
      const secondaryApp = initializeApp(firebaseConfig, 'Secondary-'+Date.now());
      const secondaryAuth = getAuth(secondaryApp);
      const cred = await createUserWithEmailAndPassword(secondaryAuth, email, pass);
      await setDoc(doc(db,'users',cred.user.uid), {
        role:'instructor', name, email, pricePerLesson:price, canManageAll, createdAt: serverTimestamp()
      });
      await signOut(secondaryAuth);
      await deleteApp(secondaryApp);
      showToast('Konto instruktora utworzone');
    }
    closeInstructorModal();
  }catch(e){
    showToast('Błąd: '+(e.message||'nie udało się zapisać'));
  }finally{
    btn.disabled = false;
  }
};

window.approveReminders = async function(dateIso){
  const toSend = lessons.filter(l=>l.date===dateIso && !l.reminderSent && l.status!=='cancelled');
  if(toSend.length===0){ showToast('Brak przypomnień do wysłania'); return; }
  if(!settings.smsWebhookUrl){
    showToast('Skonfiguruj najpierw bramkę SMS w Ustawieniach');
    return;
  }
  try{
    await fetch(settings.smsWebhookUrl, {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body: JSON.stringify({lessons: toSend.map(l=>({id:l.id, phone:l.studentPhone, name:l.studentName, time:l.time, date:l.date, instructor:l.instructorName}))})
    });
    await Promise.all(toSend.map(l=>updateDoc(doc(db,'lessons',l.id), {reminderSent:true})));
    showToast('SMS-y wysłane');
  }catch(e){
    showToast('Błąd wysyłki: sprawdź adres bramki SMS');
  }
};

/* =====================================================================
   ENROLLMENT WIZARD
   Każdy krok renderuje własny przycisk "Dalej" tuż pod polem — nie jest
   on przyklejony na sztywno do dołu ekranu.
===================================================================== */
const STEPS = ['date','time','name','phone','level','confirm'];
const STEP_LABELS = ['Data','Godzina','Imię','Telefon','Poziom','Potwierdź'];
let wStep = 0;
let wData = {};
let wCalMonth, wCalYear;

window.openWizard = function(){
  wStep = 0;
  wData = {
    date:null,
    instructorId: currentUser.role==='instructor' ? currentUser.uid : null,
    instructorName: currentUser.role==='instructor' ? currentUser.name : null,
    time:null, name:'', countryCode:'+48', phone:'', level:null,
    lessonType:'individual', groupSize:2, paymentStatus:'unpaid', notes:'',
    price: settings.basePrice, priceTouched:false
  };
  const d = new Date(); wCalMonth = d.getMonth(); wCalYear = d.getFullYear();
  document.getElementById('wizard-overlay').classList.add('active');
  renderLiftTrack();
  renderWizardStep();
};
window.closeWizard = function(){ document.getElementById('wizard-overlay').classList.remove('active'); };

function renderLiftTrack(){
  const el = document.getElementById('lift-stations');
  el.innerHTML = STEP_LABELS.map((label,i)=>`
    <div class="lift-station ${i<wStep?'done':''} ${i===wStep?'current':''}">
      <div class="lift-pole">${i<wStep?'✓':i+1}</div>
      <div class="lift-label">${label}</div>
    </div>`).join('');
  const pct = wStep/(STEPS.length-1)*100;
  document.getElementById('lift-fill').style.width = pct+'%';
  document.getElementById('lift-chair').style.left = `calc(${pct}% + 34px - 10px)`;
}

// Builds the Wstecz/Dalej button row embedded right under each step's content.
function actionsHtml(nextEnabled, isLast){
  const backBtn = wStep>0
    ? `<button class="btn btn-outline" onclick="wizardStepBack()">Wstecz</button>`
    : `<button class="btn btn-outline" onclick="closeWizard()">Anuluj</button>`;
  const nextBtn = `<button class="btn btn-primary" id="wizard-next-btn" ${nextEnabled?'':'disabled'} onclick="${isLast?'submitWizard()':'wizardStepNext()'}">${isLast?'Zatwierdź zapis':'Dalej'}</button>`;
  return `<div class="wizard-actions">${backBtn}${nextBtn}</div>`;
}

window.wizardStepBack = function(){ wStep--; renderLiftTrack(); renderWizardStep(); };
window.wizardStepNext = function(){ wStep++; renderLiftTrack(); renderWizardStep(); };

function renderWizardStep(){
  const body = document.getElementById('wizard-body');
  const step = STEPS[wStep];

  if(step==='date'){
    body.innerHTML = `<div class="wizard-panel">
      <h2>Wybierz datę</h2>
      <div class="wizard-hint">Na jaki dzień zapisujemy kursanta?</div>
      <div class="big-cal" id="w-big-cal"></div>
      ${actionsHtml(!!wData.date, false)}
    </div>`;
    renderWizardCal();
    return;
  }

  if(step==='time'){
    const dayLessons = lessons.filter(l=>l.date===wData.date && l.status!=='cancelled');
    const needInstructorPick = currentUser.role==='operator';
    let instrHtml = '';
    if(needInstructorPick){
      instrHtml = `<div class="instr-pick">${instructors.map(i=>`
        <div class="instr-chip ${wData.instructorId===i.uid?'selected':''}" onclick="pickInstructor('${i.uid}','${i.name.replace(/'/g,"\\'")}')">${i.name}</div>
      `).join('') || '<div style="color:var(--mist-dim);font-size:13px;">Brak instruktorów — dodaj ich w panelu Instruktorzy.</div>'}</div>`;
    }
    const slots = [];
    for(let h=settings.dayStart; h<settings.dayEnd; h++){
      for(let m=0; m<60; m+=settings.lessonDuration){
        slots.push(`${pad(h)}:${pad(m)}`);
      }
    }
    body.innerHTML = `<div class="wizard-panel">
      <h2>Godzina zajęć</h2>
      <div class="wizard-hint">${fmtDatePL(wData.date)}${needInstructorPick?' — wybierz instruktora i godzinę':''}</div>
      ${instrHtml}
      <div class="slot-grid" id="w-slots">
        ${slots.map(s=>{
          const taken = dayLessons.some(l=>l.time===s && l.instructorId===wData.instructorId);
          return `<div class="slot ${taken?'taken':''} ${wData.time===s?'selected':''}" onclick="pickTime('${s}')">${s}</div>`;
        }).join('')}
      </div>
      ${actionsHtml(!!wData.time && !!wData.instructorId, false)}
    </div>`;
    return;
  }

  if(step==='name'){
    body.innerHTML = `<div class="wizard-panel">
      <h2>Imię ucznia</h2>
      <div class="wizard-hint">Jak nazywa się kursant?</div>
      <input class="big-input" id="w-name" placeholder="Imię i nazwisko" value="${wData.name}" autocomplete="off" oninput="onNameFieldInput(this)">
      ${actionsHtml(wData.name.trim().length>1, false)}
    </div>`;
    setTimeout(()=>document.getElementById('w-name')?.focus(), 50);
    return;
  }

  if(step==='phone'){
    const cc = COUNTRY_CODES.find(c=>c.code===wData.countryCode);
    body.innerHTML = `<div class="wizard-panel">
      <h2>Telefon kontaktowy</h2>
      <div class="wizard-hint">Numer do wysyłki przypomnień SMS</div>
      <div class="phone-row">
        <select id="w-cc" onchange="onCountryChange(this)">
          ${COUNTRY_CODES.map(c=>`<option value="${c.code}" ${wData.countryCode===c.code?'selected':''}>${c.label}</option>`).join('')}
        </select>
        <input class="big-input" id="w-phone" placeholder="${'9'.repeat(cc.digits)}" value="${wData.phone}" inputmode="numeric" maxlength="${cc.digits}" oninput="onPhoneFieldInput(this)">
      </div>
      <div class="field-error" id="w-phone-err"></div>
      ${actionsHtml(wData.phone.length===cc.digits, false)}
    </div>`;
    setTimeout(()=>document.getElementById('w-phone')?.focus(), 50);
    return;
  }

  if(step==='level'){
    body.innerHTML = `<div class="wizard-panel">
      <h2>Poziom zaawansowania</h2>
      <div class="wizard-hint">Jak radzi sobie kursant na nartach?</div>
      <div class="level-list">
        ${LEVELS.map(l=>`<div class="level-card ${wData.level===l.n?'selected':''}" style="--lv-active:${cssColor(l.key)}" onclick="pickLevel(${l.n})">
          <div class="level-badge" style="background:${cssColor(l.key)};${l.n===4?'border:2px solid '+cssColor('lv5')+';':''}">${l.n}</div>
          <div class="level-text"><b>${l.label}</b><span>${l.desc}</span></div>
        </div>`).join('')}
      </div>
      ${actionsHtml(!!wData.level, false)}
    </div>`;
    return;
  }

  if(step==='confirm'){
    const lv = levelMeta(wData.level);
    if(!wData.priceTouched){
      wData.price = settings.basePrice * (wData.lessonType==='group' ? wData.groupSize : 1);
    }
    body.innerHTML = `<div class="wizard-panel">
      <h2>Potwierdź zapis</h2>
      <div class="wizard-hint">Sprawdź dane przed zapisaniem</div>
      <div class="card" style="margin:0;">
        <div class="summary-list">
          <div class="summary-row"><span class="k">Data</span><span class="v">${fmtDatePL(wData.date)}</span></div>
          <div class="summary-row"><span class="k">Godzina</span><span class="v">${wData.time}</span></div>
          <div class="summary-row"><span class="k">Instruktor</span><span class="v">${wData.instructorName}</span></div>
          <div class="summary-row"><span class="k">Uczeń</span><span class="v">${wData.name}</span></div>
          <div class="summary-row"><span class="k">Telefon</span><span class="v">${wData.countryCode} ${wData.phone}</span></div>
          <div class="summary-row"><span class="k">Poziom</span><span class="v" style="color:${cssColor(lv.key)}">${lv.n} — ${lv.label}</span></div>
        </div>

        <div class="optional-block">
          <div class="opt-label">Typ zajęć</div>
          <div class="choice-row">
            <div class="choice-chip ${wData.lessonType==='individual'?'selected':''}" onclick="setLessonType('individual')">Indywidualne</div>
            <div class="choice-chip ${wData.lessonType==='group'?'selected':''}" onclick="setLessonType('group')">Grupowe</div>
          </div>
          ${wData.lessonType==='group' ? `
          <div class="field" style="max-width:160px;margin-bottom:14px;">
            <label>Liczba uczestników</label>
            <input type="number" min="2" max="12" value="${wData.groupSize}" oninput="onGroupSizeInput(this)">
          </div>` : ''}

          <div class="opt-label">Cena za te zajęcia</div>
          <div class="field" style="margin-bottom:6px;">
            <div style="position:relative;">
              <input type="number" min="0" step="5" id="w-price-input" value="${wData.price}" style="padding-right:52px;" oninput="onPriceInput(this)">
              <span style="position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--mist-dim);font-weight:700;font-size:13px;">zł</span>
            </div>
          </div>
          <div style="margin-bottom:14px;">
            <button type="button" class="icon-btn" onclick="resetPriceToDefault()">↺ Cena domyślna (${fmtMoney(settings.basePrice * (wData.lessonType==='group' ? wData.groupSize : 1))})</button>
          </div>

          <div class="opt-label">Płatność</div>
          <div class="choice-row">
            <div class="choice-chip ${wData.paymentStatus==='unpaid'?'selected pay-warn':''}" onclick="setPaymentStatus('unpaid')">Do zapłaty</div>
            <div class="choice-chip ${wData.paymentStatus==='paid'?'selected pay-ok':''}" onclick="setPaymentStatus('paid')">Zapłacono</div>
          </div>

          <div class="opt-label">Uwagi (opcjonalnie)</div>
          <div class="field" style="margin-bottom:0;">
            <textarea rows="2" placeholder="Sprzęt, kontuzje, uwagi dla instruktora…" oninput="onNotesInput(this)">${wData.notes}</textarea>
          </div>
        </div>
      </div>
      ${actionsHtml(true, true)}
    </div>`;
    return;
  }
}

function renderWizardCal(){
  const el = document.getElementById('w-big-cal');
  const first = new Date(wCalYear, wCalMonth, 1);
  const startDow = first.getDay();
  const daysInMonth = new Date(wCalYear, wCalMonth+1, 0).getDate();
  const todayIso = todayISO();
  let html = `<div class="big-cal-head">
    <button onclick="wCalNav(-1)">‹</button>
    <div class="month">${MONTHS[wCalMonth]} ${wCalYear}</div>
    <button onclick="wCalNav(1)">›</button>
  </div><div class="big-cal-grid">`;
  DOW.forEach(d=>html+=`<div class="cal-dow">${d}</div>`);
  for(let i=0;i<startDow;i++) html+=`<div class="big-cal-cell disabled"></div>`;
  for(let d=1; d<=daysInMonth; d++){
    const iso = `${wCalYear}-${pad(wCalMonth+1)}-${pad(d)}`;
    const isPast = iso < todayIso;
    const isToday = iso===todayIso;
    const sel = wData.date===iso;
    html+=`<div class="big-cal-cell ${isPast?'disabled':''} ${isToday?'today':''} ${sel?'selected':''}" onclick="${isPast?'':`pickDate('${iso}')`}">${d}</div>`;
  }
  html+='</div>';
  el.innerHTML = html;
}
window.wCalNav = function(dir){
  wCalMonth += dir;
  if(wCalMonth<0){wCalMonth=11;wCalYear--;}
  if(wCalMonth>11){wCalMonth=0;wCalYear++;}
  renderWizardCal();
};

/* --- Step interaction handlers: every one is exposed on window because
   inline HTML attributes cannot see module-scope variables/functions --- */
window.pickDate = function(iso){ wData.date = iso; renderWizardCal(); document.getElementById('wizard-next-btn').disabled = false; };
window.pickInstructor = function(uid, name){ wData.instructorId = uid; wData.instructorName = name; wData.time = null; renderWizardStep(); };
window.pickTime = function(t){ wData.time = t; renderWizardStep(); };
window.pickLevel = function(n){ wData.level = n; renderWizardStep(); };

window.onNameFieldInput = function(el){
  wData.name = el.value;
  const btn = document.getElementById('wizard-next-btn');
  if(btn) btn.disabled = el.value.trim().length <= 1;
};

window.onCountryChange = function(sel){
  wData.countryCode = sel.value;
  wData.phone = '';
  renderWizardStep();
};

window.onPhoneFieldInput = function(el){
  const cc = COUNTRY_CODES.find(c=>c.code===wData.countryCode);
  const digits = el.value.replace(/\D/g,'').slice(0, cc.digits);
  el.value = digits;
  wData.phone = digits;
  const valid = digits.length === cc.digits;
  const errEl = document.getElementById('w-phone-err');
  if(errEl) errEl.textContent = (digits.length>0 && !valid) ? `Numer musi mieć ${cc.digits} cyfr.` : '';
  const btn = document.getElementById('wizard-next-btn');
  if(btn) btn.disabled = !valid;
};

window.setLessonType = function(type){ wData.lessonType = type; renderWizardStep(); };
window.onGroupSizeInput = function(el){
  wData.groupSize = Math.max(2, Number(el.value)||2);
  if(!wData.priceTouched){
    wData.price = settings.basePrice * wData.groupSize;
    const priceEl = document.getElementById('w-price-input');
    if(priceEl) priceEl.value = wData.price;
    const hint = el.closest('.optional-block')?.querySelector('.icon-btn');
    if(hint) hint.textContent = `↺ Cena domyślna (${fmtMoney(wData.price)})`;
  }
};
window.onPriceInput = function(el){
  wData.price = Number(el.value)||0;
  wData.priceTouched = true;
};
window.resetPriceToDefault = function(){
  wData.priceTouched = false;
  wData.price = settings.basePrice * (wData.lessonType==='group' ? wData.groupSize : 1);
  const priceEl = document.getElementById('w-price-input');
  if(priceEl) priceEl.value = wData.price;
  showToast('Przywrócono cenę domyślną');
};
window.setPaymentStatus = function(status){ wData.paymentStatus = status; renderWizardStep(); };
window.onNotesInput = function(el){ wData.notes = el.value; };

window.submitWizard = async function(){
  const btn = document.getElementById('wizard-next-btn');
  btn.disabled = true; btn.textContent = 'Zapisywanie…';
  try{
    const instructor = instructors.find(i=>i.uid===wData.instructorId) || (currentUser.role==='instructor' ? currentUser : null);
    const instructorPay = instructor ? (instructor.pricePerLesson ?? settings.instructorRateDefault) : settings.instructorRateDefault;
    await addDoc(collection(db,'lessons'), {
      date: wData.date,
      time: wData.time,
      instructorId: wData.instructorId,
      instructorName: wData.instructorName,
      studentName: wData.name.trim(),
      studentPhone: wData.countryCode + wData.phone,
      level: wData.level,
      clientPrice: wData.price,
      instructorPay: instructorPay,
      lessonType: wData.lessonType,
      groupSize: wData.lessonType==='group' ? wData.groupSize : 1,
      paymentStatus: wData.paymentStatus,
      notes: wData.notes.trim(),
      status: 'planned',
      reminderSent: false,
      createdBy: currentUser.uid,
      createdAt: serverTimestamp()
    });
    showToast('Uczeń zapisany na zajęcia');
    closeWizard();
    calSelectedDate = wData.date;
    currentPage = 'zapisy';
    renderPage();
  }catch(e){
    showToast('Błąd zapisu: '+(e.message||''));
  }finally{
    btn.disabled = false;
  }
};
</script>
</body>
</html>
